name: ShellCheck

on:
  push:

jobs:
  shellcheck:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Run ShellCheck
        run: |
          find . -type f \( -name '*.sh' -o -path './bin/*' \) -print0 |
          xargs -0 shellcheck