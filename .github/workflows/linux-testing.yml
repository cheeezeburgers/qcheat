name: Linux Test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  ubuntu-bash:
    name: Ubuntu / bash
    runs-on: ubuntu-latest

    env:
      SHELL: /bin/bash

    defaults:
      run:
        shell: bash

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Show environment
        run: |
          cat /etc/os-release
          uname -m
          bash --version

      - name: Check Bash syntax
        run: |
          bash -n install.sh
          bash -n bin/qcheat
          bash -n lib/docs.sh
          bash -n dev/tests/run.sh
          bash -n dev/release.sh
          bash -n dev/uninstall.sh
          bash -n dev/tests/helpers.sh

      - name: Test offline documentation, installation and helpers
        run: bash dev/tests/run.sh

      - name: Test installer dry-run
        run: |
          printf 'y\ny\n' | ./install.sh --dry-run
