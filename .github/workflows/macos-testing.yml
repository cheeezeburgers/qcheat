name: macOS Test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  macos-zsh:
    name: macOS / zsh
    runs-on: macos-latest

    env:
      SHELL: /bin/zsh

    defaults:
      run:
        shell: zsh {0}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Show environment
        run: |
          sw_vers
          uname -m
          zsh --version
          brew --version

      - name: Check Bash syntax
        run: |
          bash -n install.sh
          bash -n bin/qcheat
          bash -n lib/docs.sh
          bash -n dev/tests/run.sh

      - name: Test offline documentation lookup and installation
        run: bash dev/tests/run.sh

      - name: Test installer dry-run
        run: |
          printf 'y\ny\n' | ./install.sh --dry-run
